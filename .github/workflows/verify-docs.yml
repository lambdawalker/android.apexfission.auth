# Standalone docs bootstrap and read-only validation.
name: Verify documentation tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify POSIX launcher and documentation
        if: runner.os == 'Linux'
        run: |
          sh ./docs.sh bootstrap check
          sh ./docs.sh check
      - name: Verify Windows launcher and documentation
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call docs.bat bootstrap check
          if errorlevel 1 exit /b %errorlevel%
          call docs.bat check
          if errorlevel 1 exit /b %errorlevel%
  generate-feature-source-inventory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/email-verification-low-friction-20261114'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate source inventory with the pinned docs CLI
        run: sh ./docs.sh sources update
      - name: Commit only generated source inventory
        run: |
          git add docs/agents/api-inventory.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate auth API inventory for unified verification"
            git fetch origin feat/email-verification-low-friction-20261114
            git rebase origin/feat/email-verification-low-friction-20261114
            git push origin HEAD:feat/email-verification-low-friction-20261114
          fi
