name: Repair ID review source manifest (temporary)
on:
  push:
    branches: [feat/auto-continue-id-review-20261114]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate both source documentation outputs
        run: |
          sh ./docs.sh sources update
          sh ./docs.sh sources check
          git add docs/api-inputs.json docs/agents/api-inventory.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Synchronize ID review API input manifest'
            git push origin HEAD:feat/auto-continue-id-review-20261114
          fi
      - name: Package tracked source for offline review
        run: |
          git archive --format=tar.gz --output=/tmp/auth-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/source-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: id-review-source
          path: |
            /tmp/auth-source.tar.gz
            /tmp/source-sha.txt
          retention-days: 3
