name: Reconcile ID-review docs and screenshots (temporary)
on:
  push:
    branches:
      - feat/auto-continue-id-review-20261114
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/feat/auto-continue-id-review-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Regenerate source documentation
        run: sh ./docs.sh sources update
      - name: Render screenshot candidates
        run: |
          python3 scripts/screenshots/suite.py coverage
          bash gradlew :auth:updateDebugScreenshotTest :app:updateDebugScreenshotTest --stacktrace
          python3 scripts/screenshots/suite.py candidates
          python3 scripts/screenshots/review.py
      - name: Apply provenance-only patch after byte-identical renders
        run: |
          if test -f docs/generated/screenshots/review/provenance.patch; then
            git apply docs/generated/screenshots/review/provenance.patch
          elif grep -q 'Screenshot files and render inputs match' docs/generated/screenshots/review/summary.txt; then
            echo 'No screenshot update needed.'
          else
            echo 'Screenshot pixels changed; preserve candidates for review and do not auto-accept.'
            exit 1
          fi
          git add docs/agents/api-inventory.md docs/screenshots/baselines.json docs/screenshots/documentation.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh ID-review source inventory and screenshot provenance"
            git push origin HEAD:feat/auto-continue-id-review-20261114
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: id-review-candidate-comparison
          path: docs/generated/screenshots/
          if-no-files-found: warn
