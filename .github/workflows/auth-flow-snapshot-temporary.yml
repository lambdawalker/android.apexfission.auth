name: Auth flow source snapshot (temporary)
on:
  push:
    branches: [feat/persistent-auth-flow-20261115]
    paths: [.github/workflows/auth-flow-snapshot-temporary.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare source snapshots
        run: |
          mkdir -p /tmp/auth-flow
          git archive --format=tar.gz --output=/tmp/auth-flow/auth.tar.gz HEAD
          git rev-parse HEAD > /tmp/auth-flow/source-sha.txt
          for repo in agents.prompts android.ui.common go.apexfission.aws.auth design.attestra; do
            git clone --depth 1 https://github.com/lambdawalker/$repo.git /tmp/$repo
            git -C /tmp/$repo archive --format=tar.gz --output=/tmp/auth-flow/$repo.tar.gz HEAD
            git -C /tmp/$repo rev-parse HEAD > /tmp/auth-flow/$repo.sha
          done
      - name: Install the pinned source documentation generator
        run: |
          sh ./docs.sh --version
          find .project/docs/cache -type f -name android-repo-docs -exec cp '{}' /tmp/auth-flow/android-repo-docs \;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auth-flow-source
          path: /tmp/auth-flow/
          retention-days: 3
