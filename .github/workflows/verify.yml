name: Android verification
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      # Use the hosted Android SDK; AGP resolves the pinned SDK components.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test signing tools
        run: python3 -m unittest discover -s scripts/signing
      - name: Verify auth translations
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_auth_resources.py'
          python3 -m unittest discover -s scripts/geography -p 'test_*.py'
      - name: Test auth and assemble app
        run: >-
          bash gradlew :auth:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :auth:assembleDebugAndroidTest :app:assembleDebugAndroidTest
          -PattestraEnvironment=qa
      - name: Check explicit API override
        run: >-
          bash gradlew :app:generateDebugBuildConfig
          -PattestraApiBaseUrl=https://api.example.invalid
          -PattestraLinkHost=app.example.invalid
      - name: Verify feature conventions
        run: python3 scripts/verification/verify_conventions.py
      - name: Exercise persistent signing with an ephemeral test certificate
        env:
          ATTESTRA_KEYSTORE_PASSWORD: ci-test-only-password
        run: |
          export ATTESTRA_KEYSTORE_PATH="$RUNNER_TEMP/attestra-test.p12"
          trap 'rm -f "$ATTESTRA_KEYSTORE_PATH"; rm -rf .gradle/configuration-cache' EXIT
          python3 scripts/signing/signing.py generate --keystore "$ATTESTRA_KEYSTORE_PATH" --output "$RUNNER_TEMP/association-test.json"
          bash gradlew --no-configuration-cache :app:assembleRelease -PattestraEnvironment=qa
          python3 scripts/signing/smoke.py --associations "$RUNNER_TEMP/association-test.json" --apk app/build/outputs/apk/release/app-release.apk
  document-review-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise document review on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            bash gradlew :auth:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.apexfission.android.auth.capture.DocumentReviewUiTest
            bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.apexfission.android.auth.OnboardingEntryScreenTest,com.apexfission.android.auth.LocalCardCaptureDemoTest,com.apexfission.android.auth.DemoWindowSecurityTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: document-review-device-results
          path: |
            auth/build/reports/androidTests/
            auth/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
