name: Accept reviewed email verification screenshots (temporary)
on:
  push:
    branches:
      - feat/email-verification-low-friction-20261114
permissions:
  contents: write
  actions: read
jobs:
  accept-reviewed:
    if: github.ref == 'refs/heads/feat/email-verification-low-friction-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          run-id: 43682313193
          name: screenshot-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Accept inspected six changed screenshot comparisons
        run: |
          python3 scripts/screenshots/suite.py accept --directory docs/generated/screenshots --reviewed-by "Reviewed 6 old/new UI screenshot comparisons (email wait light/dark, manual code light/dark, error/narrow) on 2026-11-14; expected merged screen."
          python3 scripts/screenshots/suite.py restore
          python3 scripts/screenshots/suite.py verify-docs
      - name: Commit reviewed baselines and documentation provenance
        run: |
          git add docs/screenshots/baselines.zip docs/screenshots/baselines.json docs/screenshots/documentation.json docs/assets/screenshots
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Accept reviewed combined email verification screenshots"
            git push origin HEAD:feat/email-verification-low-friction-20261114
          fi
