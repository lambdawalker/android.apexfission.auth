name: Prepare camera disclosure permission (temporary)
on:
  push:
    branches: [feat/camera-disclosure-permission-20261115]
permissions:
  contents: write
concurrency:
  group: prepare-camera-disclosure-permission
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Apply authored changes and generate source metadata
        run: |
          git apply --check camera-permission.patch
          git apply camera-permission.patch
          rm camera-permission.patch .github/workflows/prepare-camera-permission-temporary.yml
          sh ./docs.sh sources update
          sh ./docs.sh sources check
          python3 scripts/screenshots/suite.py coverage
          python3 -m unittest discover -s scripts/screenshots -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_auth_resources.py'
          git add -A -- .github/workflows/verify.yml .github/workflows/prepare-camera-permission-temporary.yml camera-permission.patch app/src/main/java/com/apexfission/android/auth/LiveCaptureFlow.kt auth/src/androidTest/java/com/apexfission/android/auth/identity/capture auth/src/main/java/com/apexfission/android/auth/identity/capture/CameraPermissionRoute.kt auth/src/main/java/com/apexfission/android/auth/identity/capture/IdentityCameraAfterDisclosure.kt auth/src/screenshotTest/kotlin/com/apexfission/android/auth/identity/capture/CameraPermissionScreenshotTest.kt auth/src/test/java/com/apexfission/android/auth/identity/capture/CameraPermissionRouteTest.kt docs/identity-capture.md docs/screenshots/coverage.json docs/screenshots/scenarios.json docs/superpowers/plans/2026-11-15-camera-disclosure-permission.md docs/api-inputs.json docs/agents/api-inventory.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Request camera permission directly after accepted capture disclosure'
          git push origin HEAD:feat/camera-disclosure-permission-20261115
          mkdir -p .ci-evidence
          git rev-parse HEAD > .ci-evidence/source-sha.txt
          git archive --format=tar.gz --output=.ci-evidence/source.tar.gz HEAD
      - name: Compile and run Android unit tests
        run: bash gradlew :auth:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :auth:assembleDebugAndroidTest :app:assembleDebugAndroidTest --stacktrace
      - name: Check repository conventions
        run: python3 scripts/verification/verify_conventions.py
      - name: Render unapproved screenshot candidates
        run: |
          bash gradlew :auth:updateDebugScreenshotTest :app:updateDebugScreenshotTest --stacktrace
          python3 scripts/screenshots/suite.py candidates
          python3 scripts/screenshots/review.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: camera-permission-evidence
          path: |
            .ci-evidence/
            docs/generated/screenshots/
            auth/build/test-results/
            app/build/test-results/
            auth/build/reports/tests/
            app/build/reports/tests/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
