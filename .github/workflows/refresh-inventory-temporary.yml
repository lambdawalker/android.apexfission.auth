name: Refresh auth source inventory (temporary)
on:
  push:
    branches:
      - feat/email-verification-low-friction-20261114
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/feat/email-verification-low-friction-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sh ./docs.sh sources update
      - name: Push generated source inventory
        run: |
          git add docs/agents/api-inventory.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate auth source inventory"
            git push origin HEAD:feat/email-verification-low-friction-20261114
          fi
