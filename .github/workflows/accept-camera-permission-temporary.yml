name: Accept reviewed camera recovery screenshots (temporary)
on:
  push:
    branches: [feat/camera-disclosure-permission-20261115]
    paths: [.github/workflows/accept-camera-permission-temporary.yml]
permissions:
  contents: write
  actions: read
jobs:
  accept-reviewed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          run-id: 43746993933
          name: camera-permission-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify exactly the four reviewed additions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('docs/screenshots/baselines.json').read_text())
          new = json.loads(Path('docs/generated/screenshots/manifest.json').read_text())
          before = {x['path']: x['sha256'] for x in old['images']}
          after = {x['path']: x['sha256'] for x in new['images']}
          assert len(before) == 88 and len(after) == 92
          assert all(after.get(path) == sha for path, sha in before.items())
          added = set(after) - set(before)
          assert len(added) == 4 and all('CameraPermissionScreenshotTest/' in path for path in added)
          assert new['inputs']['sha256'] == '4d4ca41d69add1b508dfc47cd23df005ba054039ecec00581b4d271dabc2f5d6'
          PY
      - name: Accept inspected production recovery states
        run: |
          python3 scripts/screenshots/suite.py accept --directory docs/generated/screenshots --reviewed-by 'OpenAI visual review 2026-11-15: inspected Retry and Settings in light/dark; legible controls, no clipping, expected recovery actions. Existing 88 PNGs unchanged. Native dialogs not claimed.'
          python3 scripts/screenshots/suite.py restore
          python3 scripts/screenshots/suite.py verify-docs
          git add docs/screenshots/baselines.zip docs/screenshots/baselines.json docs/screenshots/documentation.json docs/assets/screenshots
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Accept reviewed camera permission recovery baselines'
          git push origin HEAD:feat/camera-disclosure-permission-20261115
