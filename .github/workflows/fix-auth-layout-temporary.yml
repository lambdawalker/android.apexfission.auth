name: Validate responsive auth task fix (temporary)
on:
  push:
    branches: [feat/persistent-auth-flow-20261115]
    paths: [.github/workflows/fix-auth-layout-temporary.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Apply source fix and regenerate source metadata
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '11aeb91b7e872b97a45fa25d3339d8ea0f9ece77d2e0be968282131bac9dc18b'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          sh ./docs.sh sources update
          sh ./docs.sh sources check
          python3 scripts/screenshots/suite.py coverage
          git add docs/api-inputs.json docs/agents/api-inventory.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep recipient readable on narrow screens and close abandoned passkey tasks'
          git push origin HEAD:feat/persistent-auth-flow-20261115
      - name: Compile apps and run JVM tests
        run: bash gradlew :auth:testDebugUnitTest :app:testDebugUnitTest :auth:assembleDebugAndroidTest :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Render candidates without accepting them
        run: |
          bash gradlew :auth:updateDebugScreenshotTest :app:updateDebugScreenshotTest --stacktrace
          python3 scripts/screenshots/suite.py candidates
          python3 scripts/screenshots/review.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: responsive-auth-candidates
          path: |
            docs/generated/screenshots/
            auth/build/reports/
            auth/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 3
